name: CI
on:
  push:
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INVOKE_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r requirements-dev.txt
      - name: Tests Python (incluye invariantes en la base y verificador de accesos)
        run: pytest -q
      - name: Tests JS (baterías compartidas con Python)
        run: node --test tests/js/*.test.mjs
      - name: Chequeo de tipos del frontend (sin build)
        run: npx --yes typescript@5.6.3 tsc -p .
