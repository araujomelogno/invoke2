# coturn — TURN propio desde el día uno (ADR-005). Dimensionado para 30 sesiones
# concurrentes de audio (~100 kbps c/u con relay): una VM e2-small alcanza.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
# Mismo secreto que TURN_SECRETO de la API (Secret Manager). Credenciales efímeras.
static-auth-secret=${TURN_SECRETO}
realm=turn.invoke.equipos.com.uy
total-quota=60
user-quota=4
min-port=49152
max-port=65535
cert=/etc/coturn/certs/turn.crt
pkey=/etc/coturn/certs/turn.key
no-cli
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# Solo hacia el PBX: el relay no es un proxy abierto.
allowed-peer-ip=${PBX_IP_PUBLICA}
log-file=stdout
# Métrica de cuántas sesiones van por relay: prometheus en :9641
prometheus
