; Servidor HTTP de Asterisk.
;   8088/tcp: ARI, sin TLS. Escucha SOLO en la IP privada: lo usa el servicio ari
;             desde la VPC (conector serverless). Nunca se publica.
;   8089/tcp: WSS para SIP.js (navegadores de los puestos), con TLS. Público.
[general]
enabled=yes
bindaddr=${PBX_IP_PRIVADA}
bindport=8088
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/pbx.crt
tlsprivatekey=/etc/asterisk/keys/pbx.key
