; INVOKE 2 — módulos. Se cargan todos (autoload) salvo los que este PBX no usa:
; cada canal o servicio que no se usa es un puerto abierto o una superficie de
; ataque de más. Verificado con Asterisk 20.6 (Ubuntu 24.04): con esta lista solo
; escuchan 5060/udp (trunk), 8088/tcp (ARI, solo desde la VPC) y 8089/tcp (WSS).
;
; AMI no se usa: todo el control es por ARI (ADR-003). manager.so es parte del
; núcleo y no admite noload (Asterisk no arranca): se apaga en manager.conf.
[modules]
autoload=yes

; Canales que no son PJSIP. chan_sip (obsoleto) competiría con PJSIP por 5060/udp.
noload => chan_sip.so
noload => chan_iax2.so
noload => chan_skinny.so
noload => chan_mgcp.so
noload => chan_unistim.so
noload => chan_motif.so
noload => chan_ooh323.so
noload => chan_console.so
noload => chan_dahdi.so
noload => chan_mobile.so
noload => chan_rtp.so
noload => chan_audiosocket.so

; Servicios de red que no se usan
noload => pbx_dundi.so
noload => res_xmpp.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
noload => res_phoneprov.so
noload => res_pjsip_phoneprov_provider.so
noload => res_config_ldap.so
noload => res_statsd.so
noload => res_snmp.so
noload => res_corosync.so
noload => res_calendar.so
noload => res_calendar_caldav.so
noload => res_calendar_ews.so
noload => res_calendar_exchange.so
noload => res_calendar_icalendar.so
noload => res_geolocation.so
noload => res_pjsip_geolocation.so
noload => res_smdi.so
noload => res_aeap.so
noload => res_speech_aeap.so

; Backends de CDR y CEL: no se usan (cdr.conf, cel.conf; ADR-002 y ADR-009)
noload => cdr_pgsql.so
noload => cel_pgsql.so
noload => cdr_tds.so
noload => cel_tds.so
noload => cdr_radius.so
noload => cel_radius.so
noload => cdr_sqlite3_custom.so
noload => cel_sqlite3_custom.so
noload => cdr_odbc.so
noload => cel_odbc.so
noload => cdr_adaptive_odbc.so
noload => cdr_custom.so
noload => cel_custom.so
noload => cdr_manager.so
noload => cel_manager.so
noload => cdr_syslog.so
noload => cdr_csv.so
noload => app_page.so

; Lenguajes de dialplan alternativos y aplicaciones de PBX de oficina
noload => pbx_lua.so
noload => pbx_ael.so
noload => app_voicemail.so
noload => app_voicemail_imap.so
noload => app_voicemail_odbc.so
noload => app_minivm.so
noload => app_queue.so
noload => app_agent_pool.so
noload => app_confbridge.so
