; PBX de laboratorio: simula la PSTN y el navegador del puesto con canales Local,
; para probar el flujo ARI completo sin trunk ni WebRTC (scripts/probar_pbx.py).
; NUNCA se copia a un PBX de producción. Se activa con INVOKE_TRUNK=Local/{numero}@invoke-lab-pstn
; y se incluye desde extensions.conf con #tryinclude.

[invoke-lab-pstn]
; 0990000001 humano: timbra, atiende, dice "hola" y espera en silencio
exten => 0990000001,1,Ringing()
 same => n,Wait(1)
 same => n,Answer()
 same => n,Playback(beep)
 same => n,Wait(120)
 same => n,Hangup()
; 0990000002 ocupado. Hangup(17) y no Busy(): en un canal Local, Busy() no propaga la
; causa al originador (llega 0); con el trunk real llega 17 (user busy).
exten => 0990000002,1,Hangup(17)
; 0990000003 no contesta: timbra hasta que el originador se cansa
exten => 0990000003,1,Ringing()
 same => n,Wait(120)
; 0990000004 contestador: saludo largo y continuo
exten => 0990000004,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Wait(30)
; cualquier otro: número inexistente
exten => _X.,1,Hangup(1)

[invoke-lab-puesto]
; Hace de navegador: atiende y se queda en línea (la otra mitad del Local entra a Stasis)
exten => espera,1,Answer()
 same => n,Wait(3600)
