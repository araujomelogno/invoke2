; Objetos PJSIP de dos orígenes, en este orden:
;   1. pjsip.conf: transportes y el trunk (fijos, versionados en el repositorio)
;   2. Postgres (asterisk.ps_*): los puestos, que la API escribe y rota en cada
;      inicio de sesión. Solo lectura para el rol asterisk_rt.
; Sin las líneas "config", el realtime reemplaza al archivo y el trunk no carga
; (verificado contra Asterisk 20.6 y 22.5: ninguna llamada saldría a la PSTN).
[res_pjsip]
endpoint=config,pjsip.conf,criteria=type=endpoint
endpoint=realtime,ps_endpoints
auth=config,pjsip.conf,criteria=type=auth
auth=realtime,ps_auths
aor=config,pjsip.conf,criteria=type=aor
aor=realtime,ps_aors

[res_pjsip_endpoint_identifier_ip]
identify=config,pjsip.conf,criteria=type=identify
