; INVOKE 2 — dialplan mínimo. Toda la lógica de llamada vive en ARI (services/ari);
; el dialplan solo deja entrar canales a la aplicación Stasis "invoke".

[invoke-puesto]
; Pata permanente del puesto (ADR-011): el navegador llama a sala-<participante>.
; Solo se acepta si el endpoint autenticado es el del mismo participante.
exten => _sala-X.,1,NoOp(Puesto ${EXTEN:5})
 same => n,GotoIf($["${CHANNEL(endpoint)}" = "p${EXTEN:5}"]?ok:rechazo)
 same => n(ok),Stasis(invoke,puesto,${EXTEN:5})
 same => n,Hangup()
 same => n(rechazo),Hangup(21)

[invoke-amd]
; Power y predictivo: el respondente atendió y la llamada llegó a la aplicación como
; "amd"; ARI la manda acá (continue). AMD decide humano o máquina y la llamada vuelve
; a Stasis como "cliente" con el resultado (ARI la puentea o la corta). NOTSURE se
; trata como humano: ante la duda, no se le corta a una persona.
exten => s,1,NoOp(AMD ${LLAMADA})
 same => n,AMD(2500,1500,800,5000,100,50,3,256)
 same => n,Stasis(invoke,cliente,${LLAMADA},${AMDSTATUS})
 same => n,Hangup()

[invoke-entrante]
; Llamadas entrantes por el trunk: INVOKE 2 no atiende entrantes en Fase 1.
exten => _X.,1,Hangup(21)

