; INVOKE 2 — Asterisk 22 con chan_pjsip (ADR-003, ADR-013).
; Acá van los transportes y el trunk SIP existente (no se reevalúa). Los puestos
; (p<participante>) no están en este archivo: se leen de Postgres por realtime
; (sorcery.conf) y la API los escribe y rota en cada inicio de sesión.

[global]
type=global
user_agent=INVOKE2
; Sin endpoint anónimo: un INVITE que no se autentica contra un puesto o no viene
; de la IP del trunk se rechaza.

; ── Navegadores de los puestos (SIP.js) ──
; El puerto (8089) y el certificado TLS los define http.conf: para WSS, Asterisk
; usa su servidor HTTP e ignora bind y certificados acá.
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

; ── Trunk hacia la PSTN ──
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Compute Engine: NAT 1:1. Asterisk anuncia la IP pública en SIP y SDP.
local_net=10.0.0.0/8
external_media_address=${PBX_IP_PUBLICA}
external_signaling_address=${PBX_IP_PUBLICA}

[trunk]
type=endpoint
transport=transport-udp
context=invoke-entrante
; ADR-004: G.711 (PCMA) extremo a extremo, para que Asterisk solo puentee.
; Los puestos aceptan Opus solo si su participante lo tiene habilitado
; (invoke.participante.opus_habilitado → ps_endpoints.allow, lo escribe la API al
; iniciar sesión). Cada puesto con Opus transcodifica: la consola lo muestra.
disallow=all
allow=alaw,ulaw
outbound_auth=trunk-auth
aors=trunk
direct_media=no
rtp_symmetric=yes
force_rport=yes
from_domain=${TRUNK_DOMINIO}

[trunk-auth]
type=auth
auth_type=userpass
username=${TRUNK_USUARIO}
password=${TRUNK_CLAVE}

[trunk]
type=aor
contact=sip:${TRUNK_HOST}
qualify_frequency=30

; Las llamadas entrantes desde el proveedor se reconocen por IP (no hay entrantes
; en la Fase 1: el dialplan las rechaza). TRUNK_IP es la IP o red de señalización
; del proveedor, sin puerto.
[trunk-identify]
type=identify
endpoint=trunk
match=${TRUNK_IP}

; Si el proveedor exige registro (en lugar de autenticar por IP), descomentar:
;[trunk-registro]
;type=registration
;transport=transport-udp
;outbound_auth=trunk-auth
;server_uri=sip:${TRUNK_HOST}
;client_uri=sip:${TRUNK_USUARIO}@${TRUNK_DOMINIO}
;retry_interval=60
