; INVOKE 2 — Asterisk 20+ con chan_pjsip (ADR-003).
; Los puestos (p<participante>) se leen de Postgres por realtime (sorcery.conf);
; acá solo van transportes, plantilla WebRTC y el trunk SIP existente (no se reevalúa).

[global]
type=global
user_agent=INVOKE2

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
; Certificado del dominio público del PBX (Let's Encrypt). Ver docs/despliegue.html.
cert_file=/etc/asterisk/keys/pbx.crt
priv_key_file=/etc/asterisk/keys/pbx.key
local_net=10.0.0.0/8

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=10.0.0.0/8
external_media_address=${PBX_IP_PUBLICA}
external_signaling_address=${PBX_IP_PUBLICA}

; ── Trunk SIP existente hacia la PSTN ──
[trunk]
type=endpoint
transport=transport-udp
context=invoke-entrante
disallow=all
allow=alaw,ulaw
; ADR-004: G.711 (PCMA) extremo a extremo siempre que sea viable, para que
; Asterisk solo puentee. Si la prueba de campo pasa a Opus, se agrega opus en los
; puestos y se asume la transcodificación.
outbound_auth=trunk-auth
aors=trunk
direct_media=no
from_domain=${TRUNK_DOMINIO}

[trunk-auth]
type=auth
auth_type=userpass
username=${TRUNK_USUARIO}
password=${TRUNK_CLAVE}

[trunk]
type=aor
contact=sip:${TRUNK_HOST}
qualify_frequency=30

[trunk-identify]
type=identify
endpoint=trunk
match=${TRUNK_HOST}
