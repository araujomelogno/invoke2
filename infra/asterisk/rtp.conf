; RTP de Asterisk.
; En Compute Engine la VM no ve su IP pública: hay NAT 1:1. Los candidatos ICE que
; Asterisk le ofrece al navegador se publican con la IP pública en lugar de la privada.
; Es determinista y no depende de un servidor STUN externo.
[general]
rtpstart=10000
rtpend=20000
icesupport=yes

[ice_host_candidates]
${PBX_IP_PRIVADA} => ${PBX_IP_PUBLICA}
